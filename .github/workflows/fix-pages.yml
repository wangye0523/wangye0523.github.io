name: Fix Stuck GitHub Pages Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Cancel stuck deployment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST \
            repos/${{ github.repository }}/pages/deployments/8f1353ea3374d8b74647915a53b4dfde3a4a8ce8/cancel
